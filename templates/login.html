<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DALLE Image Generator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='login_style.css') }}">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1 class="login-title">DALLE Image Generator</h1>
            
            <!-- Login Form -->
            <form method="POST" action="/login" class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="Enter your username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Enter your password"
                        required
                    >
                </div>

                {% if error_message %}
                    <div class="error-message">{{ error_message }}</div>
                {% endif %}

                {% if success_message %}
                    <div class="success-message">{{ success_message }}</div>
                {% endif %}

                <button type="submit" class="btn btn-login">
                    <span>Login</span>
                </button>
            </form>

            <!-- Action Buttons -->
            <div class="button-group">
                <button class="btn btn-signup" onclick="location.href='/signup'">
                    <span>Sign Up</span>
                </button>
                <button class="btn btn-register" onclick="location.href='/register'">
                    <span>Register</span>
                </button>
            </div>

            <!-- Demo Credentials -->
            <div class="demo-info">
                <p><strong>Demo Credentials:</strong></p>
                <p>Username: <code>admin</code></p>
                <p>Password: <code>password123</code></p>
            </div>
        </div>
    </div>

    <script>
        // Add fade-in animation
        window.addEventListener('load', function() {
            document.querySelector('.login-box').style.animation = 'fadeIn 0.6s ease-in';
        });
    </script>
</body>
</html>
